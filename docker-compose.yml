services:
  db:
    image: postgres:16
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_appointment_system
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
